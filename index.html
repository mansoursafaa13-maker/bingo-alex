<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة بنغو أونلاين</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #162447; padding: 20px; border-radius: 15px; box-shadow: 0px 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #e43f5a; }
        .balance-box { background: #1f4068; padding: 10px; border-radius: 8px; font-size: 1.2rem; margin-bottom: 20px; }
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 20px; }
        .cell { background: #e43f5a; color: white; padding: 15px 5px; font-weight: bold; border-radius: 5px; font-size: 1.1rem; border: 1px solid #1a1a2e; }
        .cell.free { background: #00b4d8; }
        button { background-color: #0077b6; color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔴 بنغو لايف</h1>
    <div class="balance-box">مرحباً بك | الرصيد الحالي متاح في حسابك</div>
    <button onclick="alert('جاري الاتصال بالسيرفر لشراء بطاقتك...')">شراء بطاقة جولة جديدة</button>
    <div class="bingo-card">
        <div class="cell">B12</div><div class="cell">I22</div><div class="cell">N35</div><div class="cell">G50</div><div class="cell">O61</div>
        <div class="cell">B3</div><div class="cell">I18</div><div class="cell">N41</div><div class="cell">G55</div><div class="cell">O70</div>
        <div class="cell">B7</div><div class="cell">I25</div><div class="cell free">FREE</div><div class="cell">G48</div><div class="cell">O65</div>
        <div class="cell">B14</div><div class="cell">I29</div><div class="cell">N33</div><div class="cell">G52</div><div class="cell">O74</div>
        <div class="cell">B9</div><div class="cell">I16</div><div class="cell">N45</div><div class="cell">G59</div><div class="cell">O68</div>
    </div>
</div>
</body>
</html>
